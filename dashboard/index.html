<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMR Command Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322d3ee'/%3E%3Crect x='7' y='12' width='18' height='11' rx='3' fill='%2304121a'/%3E%3Ccircle cx='12' cy='17.5' r='1.7' fill='%2322d3ee'/%3E%3Ccircle cx='20' cy='17.5' r='1.7' fill='%2322d3ee'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0f1d; --bg2:#101935; --panel:rgba(26,34,56,.78); --panel2:rgba(12,18,34,.85); --line:rgba(255,255,255,.09);
  --text:#e8edf7; --muted:#8996b2; --accent:#22d3ee; --green:#10b981; --red:#ef4444; --amber:#f59e0b; --violet:#8b5cf6;
  --mapbg:#0d1424; --grid:rgba(255,255,255,.035); --shadow:0 8px 30px rgba(0,0,0,.35); --btn:#16203a; --inp:#0a1020;
}
[data-theme=light]{
  --bg:#eef1f7; --bg2:#dfe6f5; --panel:rgba(255,255,255,.88); --panel2:rgba(240,243,250,.95); --line:rgba(20,30,60,.12);
  --text:#161d30; --muted:#5d6b88; --accent:#0891b2; --mapbg:#e7ebf4; --grid:rgba(0,0,0,.05); --shadow:0 6px 22px rgba(30,45,90,.12);
  --btn:#e4e9f5; --inp:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 700px at 10% -10%,var(--bg2),var(--bg));background-attachment:fixed;color:var(--text);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button,select,input{font:inherit;color:var(--text)}
button{cursor:pointer}
/* header */
.top{display:flex;align-items:center;gap:16px;padding:10px 18px;margin:12px 12px 0;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);flex-wrap:wrap;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--violet));color:#fff}
.brand h1{font-size:18px;margin:0;line-height:1.1}
.brand small{color:var(--muted);letter-spacing:.14em;font-size:10.5px}
.tabs{display:flex;gap:4px;padding:5px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin:0 auto}
.tab{background:none;border:0;padding:6px 14px;border-radius:8px;font-weight:600;font-size:12px;letter-spacing:.04em;display:flex;align-items:center;gap:8px;color:var(--muted)}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--c)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--btn);padding:8px 14px;border-radius:10px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{filter:brightness(1.15)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:12px;background:#0b1224;color:#fff;border-color:rgba(255,255,255,.12)}
[data-theme=light] .btn.sm{background:#1d2a4a}
.btn.green{background:linear-gradient(135deg,#10b981,#06b6d4);color:#04121a;border:0}
.btn.red{background:#ef4444;color:#fff;border:0;box-shadow:0 0 18px rgba(239,68,68,.35)}
.btn.red.on{background:#f59e0b;color:#1b1200;animation:pulse 1s infinite}
.btn.cyan{background:var(--accent);color:#04121a;border:0}
.btn.on{background:var(--accent);color:#04121a;border-color:transparent}
.btn.ico{padding:8px 10px}
@keyframes pulse{50%{opacity:.6}}
.fleetpill{display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel2)}
.fleetpill input{width:170px;background:none;border:0;outline:0;font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
/* layout */
main{padding:12px;display:grid;gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}
.lower{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(320px,1fr);gap:12px}
@media(max-width:1000px){.lower{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
label.k{font-size:10.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:600;display:block}
/* robot card */
.rcard{padding:14px 16px;border-top:3px solid var(--c);cursor:pointer;transition:box-shadow .2s}
.rcard.sel{box-shadow:0 0 0 1px var(--c),var(--shadow)}
.rc-top{display:flex;align-items:center;gap:12px}
.idx{width:36px;height:36px;border-radius:10px;background:var(--c);color:#04121a;display:grid;place-items:center;font-weight:800}
.rc-name b{display:block;font-size:15px}.rc-name small{color:var(--muted)}
.rc-conn{margin-left:auto;font-size:11px;letter-spacing:.12em;color:var(--muted);display:flex;align-items:center;gap:6px}
.rc-conn.on{color:var(--green)}
.rc-link{margin:10px 0;display:flex;align-items:center;gap:8px;background:var(--panel2);padding:7px 10px;border-radius:10px}
.rc-link input{background:none;border:0;outline:0;font-family:ui-monospace,Menlo,monospace;font-size:13px;min-width:0}
.rc-link .ip{flex:1}.rc-link .port{width:52px}
.rc-grid{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:12px;padding-top:10px;border-top:1px solid var(--line)}
.pct{font-weight:700;color:var(--green);font-size:13px;margin-bottom:4px}
.bar{height:5px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:var(--green);transition:width .5s}
.bar i.mid{background:var(--amber)}.bar i.low{background:var(--red)}
.chip{display:inline-block;background:#050912;color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.06em}
.chip.man{background:var(--amber);color:#1b1200}
.st{font-size:11.5px;color:var(--accent);font-weight:600;margin-top:5px}
.st.warn{color:var(--amber)}.st.bad{color:var(--red)}
.rc-foot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.rc-foot span{flex:1;display:flex;align-items:center;gap:7px}
/* map */
.mappanel{padding:10px;display:flex;flex-direction:column;min-height:520px}
.mapwrap{position:relative;flex:1;min-height:480px;background:var(--mapbg);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.maptitle{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);padding:8px 12px;border-radius:12px;font-size:12px;z-index:2}
.maptitle b{letter-spacing:.1em}.maptitle em{font-style:normal;font-family:ui-monospace,Menlo,monospace;color:var(--accent);border:1px solid var(--accent);padding:1px 8px;border-radius:99px;font-size:11px}
.zoom{position:absolute;right:12px;top:12px;display:grid;gap:8px;z-index:2}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.maplegend{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;z-index:2}
.maplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* control panel */
.ctl{padding:16px;display:flex;flex-direction:column;gap:12px}
.ctl-head{display:flex;align-items:center;gap:10px}.ctl-head h3{margin:0;font-size:16px}.ctl-head span.n{margin-left:auto;color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:11px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.seg button.on{background:var(--accent);color:#04121a}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.navstat{margin-top:8px;text-align:center;padding:7px;border-radius:8px;background:rgba(255,255,255,.04);font-weight:700;letter-spacing:.06em;font-size:12.5px}
.navdetail{margin-top:6px;font-size:11.5px;color:var(--muted);text-align:center;min-height:16px}
.big{font-size:30px;font-weight:800;color:var(--accent);margin-top:4px}.big small{font-size:12px;color:var(--muted);font-weight:500}
.row{display:flex;gap:8px;margin-top:8px}
select,.sel,input.t{background:var(--inp);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;outline:0}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px}
.joywrap{display:flex;gap:16px;align-items:center;justify-content:center;padding:6px 0}
#stick{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.10),rgba(34,211,238,.02));border:2px solid var(--line);position:relative;touch-action:none;flex:none}
#knob{position:absolute;width:56px;height:56px;border-radius:50%;left:47px;top:47px;background:linear-gradient(135deg,var(--accent),var(--violet));box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sliders{flex:1;display:grid;gap:10px;font-size:11.5px;color:var(--muted)}
.sliders input{width:100%;accent-color:var(--accent)}
.readout{font-family:ui-monospace,Menlo,monospace;font-size:12px;text-align:center;color:var(--muted);margin-top:4px}
.hide{display:none!important}
/* logs */
.logs{padding:14px 16px}
.logs-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}.logs-head h3{margin:0;font-size:14px;letter-spacing:.08em}
.logs-head .sp{flex:1}.logs-head select{width:auto;padding:5px 8px}
#log{height:190px;overflow-y:auto;font:12px/1.65 ui-monospace,Menlo,Consolas,monospace;background:var(--panel2);border-radius:10px;padding:8px 10px;border:1px solid var(--line)}
#log div{white-space:pre-wrap}
#log .t{color:var(--muted)}#log .lv{display:inline-block;width:56px;font-weight:700}
.lv.info{color:var(--accent)}.lv.warn{color:var(--amber)}.lv.error{color:var(--red)}.lv.sys{color:var(--violet)}.lv.traffic{color:var(--green)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(3,6,14,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.open{display:flex}
.dlg{width:min(640px,100%);max-height:94vh;overflow:auto;background-color:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.dlg h2{margin:0 0 2px;font-size:19px}.dlg .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.dhead{display:flex;gap:12px;align-items:center}.dhead .ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#10b981,#06b6d4);display:grid;place-items:center;color:#04121a}
.x{margin-left:auto;background:none;border:0;font-size:20px;color:var(--muted)}
.dlg label.k{margin:12px 0 5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prio button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left}
.prio button b{display:block;font-size:13px}.prio button span{font-size:11.5px;color:var(--muted)}
.prio button.on{border-color:var(--accent);background:rgba(34,211,238,.12)}.prio button.on b{color:var(--accent)}
.rank{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel2)}
.rank-h{display:flex;font-size:12.5px;font-weight:700;margin-bottom:8px}.rank-h em{margin-left:auto;font-style:normal;color:var(--green)}
.rk{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;align-items:center;padding:9px 10px;border-radius:10px;border:1px solid var(--line);margin-top:6px;font-size:12px}
.rk.pick{border-color:var(--green);background:rgba(16,185,129,.12)}.rk.na{opacity:.5}
.rk .who{display:flex;align-items:center;gap:7px;font-weight:700;flex-wrap:wrap}.rk .who i{width:9px;height:9px;border-radius:50%}
.tag{font-size:9.5px;background:var(--green);color:#03150e;padding:1px 6px;border-radius:4px;font-weight:800;letter-spacing:.05em}
.rk .v{font-family:ui-monospace,Menlo,monospace}.rk .v small{display:block;color:var(--muted);font-size:10px;font-family:system-ui}
.note{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:10px}
.dfoot{display:grid;grid-template-columns:1fr 1.6fr;gap:12px;margin-top:16px}
.dfoot .btn{justify-content:center;padding:12px}
#toast{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:80}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:360px;font-size:13px}
.toast.warn{border-left-color:var(--amber)}.toast.error{border-left-color:var(--red)}
.estopbar{display:none;background:var(--red);color:#fff;text-align:center;font-weight:800;letter-spacing:.2em;padding:6px;margin:12px 12px 0;border-radius:10px}
.estopbar.on{display:block;animation:pulse 1s infinite}

/* --- stats strip, view toggles, camera panel, task queue --- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}
.kpi{padding:10px 14px;border-radius:14px}
.kpi b{display:block;font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:11.5px;color:var(--muted)}
.viewbar{position:absolute;left:12px;top:58px;display:flex;gap:8px;align-items:center;z-index:2;flex-wrap:wrap;max-width:calc(100% - 70px)}
.seg2{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg2 button{border:0;background:none;padding:5px 14px;border-radius:7px;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.seg2 button.on{background:var(--accent);color:#04121a}
.tg{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none}
.tg input{accent-color:var(--accent);margin:0}.tg.on{color:var(--text);border-color:var(--accent)}
.hud{position:absolute;left:12px;bottom:34px;font:11.5px ui-monospace,Menlo,monospace;color:var(--accent);z-index:2;background:var(--panel2);border:1px solid var(--line);padding:3px 9px;border-radius:8px}
.pip{position:absolute;right:12px;bottom:12px;width:300px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:3;box-shadow:var(--shadow)}
.pip-h{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;border-bottom:1px solid var(--line)}
.pip-h .sp{flex:1}.pip-h button{background:none;border:0;color:var(--muted)}
.pip img,.pip canvas{display:block;width:100%;aspect-ratio:4/3;background:#05080f;object-fit:cover}
.pip .msg{position:absolute;left:0;right:0;top:34px;bottom:0;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);padding:14px;pointer-events:none}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px}
@media(max-width:1000px){.bottom{grid-template-columns:1fr}}
.tq{padding:14px 16px}.tq h3{margin:0 0 8px;font-size:14px;letter-spacing:.08em}
.tq table{width:100%;border-collapse:collapse;font-size:12.5px}
.tq th,.tq td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}.tq th{color:var(--muted);font-weight:600;font-size:11px}
.tq .pr{display:inline-block;min-width:24px;text-align:center;border-radius:5px;padding:0 5px;font-weight:700;font-size:11px;background:var(--btn)}
.tq .empty{color:var(--muted);padding:8px 0;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="10" rx="3"/><circle cx="9" cy="13" r="1.3"/><circle cx="15" cy="13" r="1.3"/><path d="M12 8V4M9 4h6"/></svg></div>
    <div><h1>AMR Command Center</h1><small>FLEET INTERFACE V2.0</small></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="actions">
    <div class="fleetpill" title="Fleet manager rosbridge (the machine running fleet_manager)"><span class="dot" id="fdot"></span><input id="fleetUrl" spellcheck="false"></div>
    <button class="btn green" id="newTask">&#11042; New Pick Task</button>
    <button class="btn" id="connAll">Connect All</button>
    <button class="btn" id="demoBtn">Sim Demo <span class="dot" id="ddot"></span></button>
    <button class="btn ico" id="soundBtn" title="Sound">&#128263;</button>
    <button class="btn ico" id="themeBtn" title="Theme">&#9728;</button>
    <button class="btn red" id="estopBtn">&#9888; E-STOP</button>
  </div>
</header>
<div class="estopbar" id="estopBar">E-STOP ACTIVE &mdash; ALL ROBOTS HALTED</div>

<main>
  <section class="kpis" id="kpis"></section>
  <section class="cards" id="cards"></section>
  <section class="lower">
    <div class="panel mappanel">
      <div class="mapwrap" id="mapwrap">
        <canvas id="map"></canvas>
        <div class="maptitle"><b>FLEET SLAM MAP</b><em id="focusTag">Focused: &ndash;</em></div>
        <div class="zoom">
          <button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">&minus;</button>
          <button id="zall" title="Fit whole map">ALL</button><button id="zfoc" title="Centre on focused robot">&#9678;</button>
        </div>
        <div class="viewbar">
          <div class="seg2" id="viewSeg"><button data-v="map" class="on">MAP</button><button data-v="lidar">LIDAR</button></div>
          <span id="lidarOpts" class="hide" style="display:flex;gap:8px">
            <label class="tg" id="tgFollowL"><input type="checkbox" id="tgFollow" checked> Follow robot</label>
            <label class="tg" id="tgScanAllL"><input type="checkbox" id="tgScanAll"> All robots</label></span>
          <label class="tg" id="tgCamL"><input type="checkbox" id="tgCam"> Camera</label>
        </div>
        <div class="hud hide" id="hud"></div>
        <div class="pip hide" id="pip">
          <div class="pip-h"><b id="pipTitle">Camera</b><span class="sp"></span><button id="pipX" title="Hide camera">&#10005;</button></div>
          <img id="pipImg" alt="robot camera"><canvas id="pipCv" width="320" height="240" class="hide"></canvas><div class="msg" id="pipMsg"></div>
        </div>
        <div class="maplegend" id="maplegend"></div>
      </div>
    </div>
    <div class="panel ctl" id="ctl"></div>
  </section>
  <section class="bottom">
  <div class="panel tq"><h3>TASK QUEUE</h3><div id="tq"></div></div>
  <section class="panel logs">
    <div class="logs-head"><h3>SYSTEM LOGS</h3><span class="sp"></span>
      <select id="logFilter"><option value="all">All</option><option value="info">Info</option><option value="warn">Warnings</option><option value="error">Errors</option><option value="traffic">Traffic</option><option value="sys">System</option></select>
      <button class="btn sm" id="logClear">Clear</button><button class="btn sm" id="logDl">Download</button></div>
    <div id="log"></div>
  </section>
  </section>
</main>

<div id="modal"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================  helpers & state */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const VIDEO_PORT = 8181;                       // web_video_server
const RC = ["#22d3ee", "#8b5cf6", "#f59e0b", "#10b981", "#ec4899"];
const NICK = ["Alpha", "Beta", "Gamma", "Delta", "Echo"];
const store = {
  get(k, d) { try { const v = localStorage.getItem("amr." + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("amr." + k, v); } catch (e) { /* private mode */ } },

/* ----- joystick + keyboard */
function initStick() {
  const st = $("#stick"), kn = $("#knob"); if (!st) return;
  const R = 47;
  const move = (e) => {
    const b = st.getBoundingClientRect(); let dx = e.clientX - (b.left + b.width / 2), dy = e.clientY - (b.top + b.height / 2);
    const d = Math.hypot(dx, dy); if (d > R) { dx *= R / d; dy *= R / d; }
    S.man.sx = dx / R; S.man.sy = dy / R; kn.style.left = 47 + dx + "px"; kn.style.top = 47 + dy + "px";
  };
  const end = () => { S.man.sx = S.man.sy = 0; kn.style.left = kn.style.top = "47px"; };
  st.onpointerdown = (e) => { try { st.setPointerCapture(e.pointerId); } catch (x) { /* synthetic */ } move(e); };
  st.onpointermove = (e) => { if (e.buttons) move(e); };
  st.onpointerup = st.onpointercancel = end;
}
addEventListener("keydown", (e) => { if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return; S.man.keys.add(e.key.toLowerCase()); if (e.key === " ") e.preventDefault(); });

function teleopTick() {                                 // 10 Hz teleop loop
  const r = S.by[S.focus]; if (!r) return;
  const man = isManual(r) && !S.estop, k = S.man.keys;
  let lin = -S.man.sy, ang = -S.man.sx;
  if (k.has("w") || k.has("arrowup")) lin = 1; if (k.has("s") || k.has("arrowdown")) lin = -1;
  if (k.has("a") || k.has("arrowleft")) ang = 1; if (k.has("d") || k.has("arrowright")) ang = -1;
  if (k.has(" ")) { lin = 0; ang = 0; }
  const active = man && (Math.abs(lin) > 0.05 || Math.abs(ang) > 0.05);
  const el = $("#joyRead");
  if (active) { sendTwist(r, lin * S.man.maxLin, ang * S.man.maxAng); S.man.wasActive = true; if (el) el.textContent = `v = ${(lin * S.man.maxLin).toFixed(2)} m/s   ω = ${(ang * S.man.maxAng).toFixed(2)} rad/s`; }
  else if (S.man.wasActive) { sendTwist(r, 0, 0); sendTwist(r, 0, 0); S.man.wasActive = false; if (el) el.textContent = "Drag the stick or use W A S D / arrow keys · Space = stop"; }
}

/* =====================================================================  map */
function loadPGM(buf) {
  const b = new Uint8Array(buf); let p = 0;
  const tok = () => {
    for (;;) { while (p < b.length && [32, 9, 10, 13].includes(b[p])) p++; if (b[p] === 35) { while (p < b.length && b[p] !== 10) p++; } else break; }
    let s = ""; while (p < b.length && ![32, 9, 10, 13].includes(b[p])) s += String.fromCharCode(b[p++]); return s;
  };
  if (tok() !== "P5") throw new Error("PGM must be binary (P5)");
  const w = +tok(), h = +tok(), maxv = +tok(); p++;
  return {w, h, maxv, data: b.subarray(p, p + w * h)};

        if ((hold === undefined || hold === r.name) && (lh === undefined || lh === r.name)) { this.owner[nx] = r.name; r.to = nx; r.wait = 0; r.blocker = null; }
        else {

        }
      } else if (r.leg) {

    }

        target: r.target ? {x: r.target.x, y: r.target.y, dist: +roadDist([r.x, r.y], [r.target.x, r.target.y]).toFixed(2)} : null})),
      traffic: tr,
      tasks: this.tasks.filter(t => t.status === "PENDING" || t.status === "ASSIGNED").map(t => ({id: t.id, pickup: t.pickup, dropoff: t.dropoff, payload: t.payload, priority: t.priority, status: t.status, robot: t.robot})),

}
function toggleDemo() {

  }
  if (S.fleet.ws) { S.fleet.ws.onclose = null; try { S.fleet.ws.close(); } catch (e) { /* */ } S.fleet.ws = null; }
  S.status = null; S.lastT = -1; S.shown = {}; S.scan = {}; S.scanWs = {}; S.poses = {}; S.demo = new Demo(); $("#ddot").classList.add("on"); $("#demoBtn").classList.add("on"); setFleetState("on");
  S.robots.forEach(r => linkState(r, "on")); addLog("sys", "Sim Demo started (no ROS needed)"); S.demo.publish(); updatePip();

}

/* =====================================================================  boot */
async function boot() {
  document.documentElement.dataset.theme = store.get("theme", "dark"); $("#soundBtn").textContent = S.sound ? "🔊" : "🔇";
  $("#fleetUrl").value = store.get("fleet", `ws://${location.hostname || "localhost"}:9090`);
  $("#fleetUrl").onchange = () => connectFleet();
  const J = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(u + " → " + r.status); return r.json(); };
  try {
    const [rm, st, rb] = await Promise.all([J("/roadmap.json"), J("/stations.json"), J("/robots.json")]);
    S.roadmap = rm; S.stations = st; buildGraph();
    S.robots = rb.map((r, i) => ({name: r.name, idx: i, color: RC[i % RC.length], nick: NICK[i % NICK.length], dock: {x: r.x, y: r.y}, link: {ws: null, state: "off"}}));
    S.robots.forEach(r => S.by[r.name] = r); S.focus = S.robots[0].name;
  } catch (e) { addLog("error", "Could not load roadmap/robots: " + e.message + " — is dashboard_server running?"); toast("Dashboard server data missing", "error"); return; }
  try {
    S.info = await J("/map_info.json"); S.occ = loadPGM(await (await fetch("/map.pgm")).arrayBuffer()); S.mapCanvas = buildMapCanvas();
    addLog("sys", `Map loaded (${S.occ.w}×${S.occ.h}, ${S.info.resolution} m/px)`);
  } catch (e) { addLog("warn", "No SLAM map found – showing roadmap only (" + e.message + ")"); }
  S.B = bounds(); buildTabs(); buildCards(); buildLegend(); focusRobot(S.focus); resize(); fitAll(); updateTabs();
  initToggles(); setView(S.viewMode); updatePip(); setInterval(syncScanSubs, 2000); setInterval(pipTick, 250);
  connectFleet(); requestAnimationFrame(draw);
  addLog("sys", "Dashboard ready. Press Connect All, or Sim Demo to try it without ROS.");
}
window.AMR = {S, ALGOS, roadDist, mapBlocked, toggleDemo, onStatus, mapClick, openTaskDialog, teleopTick, setView, wantedScans, updatePip, pipTick, onScanMsg, onPoses, syncScanSubs};   // debug / test hook
boot();
