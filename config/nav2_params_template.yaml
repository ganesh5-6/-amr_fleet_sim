# Tokens replaced at launch: ${ROBOT} ${X} ${Y} ${YAW}
# Top-level key = namespace, so nodes resolve to /amr1/controller_server etc.
${ROBOT}:
  amcl:
    ros__parameters:
      use_sim_time: True
      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2
      base_frame_id: "${ROBOT}/base_link"
      odom_frame_id: "${ROBOT}/odom"
      global_frame_id: "map"
      scan_topic: scan
      laser_model_type: "likelihood_field"
      laser_max_range: 8.0
      laser_min_range: -1.0
      max_beams: 120
      min_particles: 300
      max_particles: 1000
      pf_err: 0.05
      pf_z: 0.99
      resample_interval: 1
      robot_model_type: "nav2_amcl::DifferentialMotionModel"
      sigma_hit: 0.1
      z_hit: 0.5
      z_max: 0.05
      z_rand: 0.5
      z_short: 0.05
      update_min_a: 0.1
      update_min_d: 0.1
      tf_broadcast: true
      transform_tolerance: 1.0
      set_initial_pose: true
      initial_pose:
        x: ${X}
        y: ${Y}
        z: 0.0
        yaw: ${YAW}

  bt_navigator:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: ${ROBOT}/base_link
      odom_topic: odom
      bt_loop_duration: 20
      default_server_timeout: 200
      transform_tolerance: 0.5

  controller_server:
    ros__parameters:
      use_sim_time: True
      controller_frequency: 10.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugin: "progress_checker"
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0
      general_goal_checker:
        stateful: True
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        yaw_goal_tolerance: 0.25
      FollowPath:
        plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        desired_linear_vel: 0.5
        lookahead_dist: 0.7
        min_lookahead_dist: 0.4
        max_lookahead_dist: 1.2
        lookahead_time: 1.5
        rotate_to_heading_angular_vel: 1.0
        transform_tolerance: 0.2
        use_velocity_scaled_lookahead_dist: true
        min_approach_linear_velocity: 0.12
        approach_velocity_scaling_dist: 0.5
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 1.0
        use_regulated_linear_velocity_scaling: true
        use_cost_regulated_linear_velocity_scaling: false
        regulated_linear_scaling_min_radius: 0.6
        regulated_linear_scaling_min_speed: 0.25
        use_rotate_to_heading: true
        rotate_to_heading_min_angle: 0.785
        max_angular_accel: 2.0
        max_robot_pose_search_dist: 10.0

  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: True
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: ${ROBOT}/odom
        robot_base_frame: ${ROBOT}/base_link
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.25
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          scan:
            topic: /${ROBOT}/scan
            data_type: "LaserScan"
            sensor_frame: ${ROBOT}/laser_frame
            marking: True
            clearing: True
            max_obstacle_height: 2.0
            raytrace_max_range: 3.0
            obstacle_min_range: 0.15
            obstacle_max_range: 2.5
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 2.0
          inflation_radius: 0.70
        always_send_full_costmap: True

  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: True
        update_frequency: 1.0
        publish_frequency: 0.5
        global_frame: map
        robot_base_frame: ${ROBOT}/base_link
        robot_radius: 0.25
        resolution: 0.05
        track_unknown_space: true
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_topic: /map
          map_subscribe_transient_local: True
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          scan:
            topic: /${ROBOT}/scan
            data_type: "LaserScan"
            sensor_frame: ${ROBOT}/laser_frame
            marking: True
            clearing: True
            max_obstacle_height: 2.0
            raytrace_max_range: 3.0
            obstacle_min_range: 0.15
            obstacle_max_range: 2.5
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 2.0
          inflation_radius: 0.70
        always_send_full_costmap: False

  planner_server:
    ros__parameters:
      use_sim_time: True
      expected_planner_frequency: 1.0
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner/NavfnPlanner"
        tolerance: 0.3
        use_astar: true
        allow_unknown: true

  behavior_server:
    ros__parameters:
      use_sim_time: True
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
      spin:
        plugin: "nav2_behaviors/Spin"
      backup:
        plugin: "nav2_behaviors/BackUp"
      drive_on_heading:
        plugin: "nav2_behaviors/DriveOnHeading"
      wait:
        plugin: "nav2_behaviors/Wait"
      global_frame: ${ROBOT}/odom
      robot_base_frame: ${ROBOT}/base_link
      transform_tolerance: 0.2
      simulate_ahead_time: 2.0
      max_rotational_vel: 1.0
      min_rotational_vel: 0.4
      rotational_acc_lim: 2.0
