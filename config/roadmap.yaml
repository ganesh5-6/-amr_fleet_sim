# Roadmap = the "railway map" robots must follow. Coordinates are in the map frame.
# Every station in stations.yaml and every robot dock must be a node here.
# Corridors: columns x=-4, 0, 4 ; rows y=-4.5, 0, 4.5  (all between/around the shelves).
nodes:
  dock_amr1: [-6.0, -4.0]
  dock_amr2: [-6.0, -2.0]
  dock_amr3: [-6.0,  0.0]
  D2: [-4.0, -4.5]
  D1: [-4.0,  0.0]
  D3: [-4.0,  4.5]
  B0: [ 0.0, -4.5]
  C0: [ 0.0,  0.0]
  T0: [ 0.0,  4.5]
  B4: [ 4.0, -4.5]
  P3: [ 4.0,  0.0]
  T4: [ 4.0,  4.5]
  P1: [ 7.0, -4.5]
  P2: [ 7.0,  4.5]
edges:
  # docks
  - [dock_amr1, D2]
  - [dock_amr2, D1]
  - [dock_amr3, D1]
  # column x=-4
  - [D2, D1]
  - [D1, D3]
  # row y=-4.5
  - [D2, B0]
  - [B0, B4]
  - [B4, P1]
  # row y=0
  - [D1, C0]
  - [C0, P3]
  # row y=4.5
  - [D3, T0]
  - [T0, T4]
  - [T4, P2]
  # column x=0
  - [B0, C0]
  - [C0, T0]
  # column x=4
  - [B4, P3]
  - [P3, T4]
