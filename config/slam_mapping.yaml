slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: amr1/odom
    base_frame: amr1/base_link
    map_frame: map
    scan_topic: /amr1/scan
    mode: mapping
    resolution: 0.05
    max_laser_range: 8.0
    minimum_time_interval: 0.5
    transform_publish_period: 0.02
    map_update_interval: 2.0
    throttle_scans: 1
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    do_loop_closing: true
    debug_logging: false
